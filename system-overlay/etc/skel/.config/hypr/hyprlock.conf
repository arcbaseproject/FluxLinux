# FluxLinux screen lock (hyprlock)

general {
  hide_cursor = true
}

# Theme variables; regenerated by flux-theme-set.
source = ~/.config/fluxlinux/theme/hyprlock-colors.conf

background {
  monitor =
  color = $flux_bg
  blur_passes = 3
  blur_size = 6
}

image {
  monitor =
  path = /usr/share/fluxlinux/branding/logo-text.png
  size = 80
  border_size = 0
  position = 0, 140
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 360, 48
  position = 0, -60
  halign = center
  valign = center
  fail_color = rgba(f87171ff)
  outer_color = $flux_surface
  inner_color = $flux_bg_solid
  font_color = $flux_fg
  check_color = $flux_accent
  placeholder_text = '<span foreground="$flux_muted_hex"> Password</span>'
  fade_on_empty = false
  rounding = 0
  outline_thickness = 1
}

label {
  monitor =
  text = cmd[update:30000] echo "$(date +'%A, %B %-d — %H:%M')"
  font_size = 13
  color = $flux_muted
  position = 0, 60
  halign = center
  valign = center
}
